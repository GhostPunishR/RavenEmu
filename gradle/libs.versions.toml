[versions]
agp = "9.3.3"
kotlin = "2.4.21"
junit = "4.13.2"
robolectric = "4.16.1"
material = "1.14.0"

[libraries]
junit4 = { module = "junit:junit", version.ref = "junit" }
robolectric-core = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
robolectric-sdk = { module = "org.robolectric:android-all-instrumented", version = "16-robolectric-13921718-i7" }
material = { module = "com.google.android.material:material", version.ref = "material" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
