name: Android CI

on:
  push:
    branches: [main, master, develop, "claude/**"]
    tags: ["v*"]
  pull_request:
  # Exécution manuelle. La publication Release reste refusée par défaut : elle
  # doit être demandée explicitement, en plus des protections de
  # l'environnement `release` (voir RELEASING.md).
  workflow_dispatch:
    inputs:
      publier_release:
        description: "Construire et publier les livrables Release signés"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, lint et APK Test
    runs-on: ubuntu-latest
    env:
      # Clé de signature **Test**, strictement distincte de la clé Release :
      # elle ne sert qu'à la variante `profil` (com.ravenemu.app.profil). Sans
      # ce secret, la construction retombe sur la clé de débogage locale — le
      # build reste possible, mais l'APK produit n'est pas publiable.
      TEST_KEYSTORE_BASE64: ${{ secrets.RAVENEMU_TEST_KEYSTORE_BASE64 }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Le wrapper Gradle est un binaire versionné dans le dépôt : il s'exécute
      # avant tout le reste et n'est relu par personne. Cette validation compare
      # `gradle-wrapper.jar` aux empreintes publiées par Gradle, avant qu'il ne
      # soit lancé — un jar substitué dans une contribution est arrêté ici.
      - name: Valider le wrapper Gradle
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Installer Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic

      - name: Installer la chaîne C++ Android
        run: |
          sdkmanager_path="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_path"
          "$sdkmanager_path" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Tester les cœurs C++ sur l'hôte
        run: |
          cmake -S cores -B build/native-host \
            -DRAVENEMU_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-host --parallel
          ctest --test-dir build/native-host --output-on-failure

      - name: Tests unitaires
        run: ./gradlew test

      # Le wrapper valide, la distribution qu'il télécharge reste à contrôler.
      # `distributionSha256Sum` s'en charge à chaque exécution, sur le poste des
      # développeurs comme ici : le wrapper refuse une archive dont l'empreinte
      # diffère. Reste à s'assurer que la valeur inscrite dans le dépôt est bien
      # celle que Gradle publie — sans quoi on épinglerait avec conviction une
      # archive substituée. Cette étape compare les deux.
      - name: Contrôler l'empreinte de la distribution Gradle
        run: |
          properties=gradle/wrapper/gradle-wrapper.properties
          url="$(sed -n 's/^distributionUrl=//p' "$properties" | sed 's/\\//g')"
          attendu="$(sed -n 's/^distributionSha256Sum=//p' "$properties")"

          if [[ -z "$attendu" ]]; then
            echo "::error::distributionSha256Sum absent de $properties : la distribution Gradle n'est pas épinglée. Voir CONTRIBUTING.md."
            exit 1
          fi

          # Empreinte publiée par Gradle à côté de l'archive. Une panne réseau ne
          # doit pas faire échouer la construction : le wrapper vérifie déjà
          # l'archive localement, ce contrôle-ci porte sur la déclaration.
          officiel="$(curl -fsSL --retry 3 --max-time 30 "$url.sha256" || true)"
          if [[ -z "$officiel" ]]; then
            echo "::notice::Empreinte officielle indisponible ($url.sha256), comparaison ignorée."
            exit 0
          fi

          if [[ "${attendu,,}" != "${officiel,,}" ]]; then
            echo "::error::distributionSha256Sum ($attendu) ne correspond pas à l'empreinte publiée par Gradle ($officiel)."
            exit 1
          fi
          echo "Distribution Gradle épinglée sur l'empreinte publiée par Gradle."

      - name: Lint
        run: ./gradlew lint

      - name: Construire l'APK Debug
        run: ./gradlew :app:android:assembleDebug

      - name: Restaurer la clé de signature Test
        if: env.TEST_KEYSTORE_BASE64 != ''
        run: |
          # `base64 -d` lit l'entrée standard : le secret ne transite ni par la
          # ligne de commande, ni par un fichier du dépôt, ni par un journal.
          printf '%s' "$TEST_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ravenemu-test.jks"
          if [[ ! -s "$RUNNER_TEMP/ravenemu-test.jks" ]]; then
            echo "::error::RAVENEMU_TEST_KEYSTORE_BASE64 n'est pas un keystore encodé en base64 exploitable."
            exit 1
          fi
          echo "RAVENEMU_TEST_KEYSTORE_PATH=$RUNNER_TEMP/ravenemu-test.jks" >> "$GITHUB_ENV"

      - name: Construire l'APK Test optimisé
        env:
          RAVENEMU_TEST_KEYSTORE_PASSWORD: ${{ secrets.RAVENEMU_TEST_KEYSTORE_PASSWORD }}
          RAVENEMU_TEST_KEY_ALIAS: ${{ secrets.RAVENEMU_TEST_KEY_ALIAS }}
          RAVENEMU_TEST_KEY_PASSWORD: ${{ secrets.RAVENEMU_TEST_KEY_PASSWORD }}
        run: ./gradlew :app:android:assembleProfil

      # Provenance de l'APK Test : empreinte du fichier, empreinte du
      # certificat de signature, commit source et nom du package. Ces quatre
      # valeurs sont publiques par nature et permettent à quiconque de vérifier
      # qu'un APK téléchargé vient bien de ce dépôt et de cette clé.
      - name: Décrire l'APK Test (empreintes et provenance)
        run: |
          apk="$(find app/android/build/outputs/apk/profil -type f -name '*.apk' -print -quit)"
          if [[ -z "$apk" ]]; then
            echo "::error::Aucun APK Test produit par assembleProfil."
            exit 1
          fi

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          if [[ -z "$apksigner" ]]; then
            echo "::error::apksigner introuvable dans le SDK Android du runner."
            exit 1
          fi

          cert_sha256="$(
            "$apksigner" verify --print-certs "$apk" |
              sed -n 's/.*certificate SHA-256 digest: *//p' | head -1
          )"
          if [[ -z "$cert_sha256" ]]; then
            echo "::error::Impossible de lire l'empreinte du certificat de l'APK Test."
            exit 1
          fi

          package="com.ravenemu.app.profil"
          apk_sha256="$(sha256sum "$apk" | cut -d' ' -f1)"
          signature_source="$([[ -n "$RAVENEMU_TEST_KEYSTORE_PATH" ]] && echo "cle-test-dediee" || echo "cle-debogage-locale")"

          {
            echo "apk_sha256=$apk_sha256"
            echo "cert_sha256=$cert_sha256"
            echo "commit=$GITHUB_SHA"
            echo "package=$package"
            echo "signature_source=$signature_source"
          } > app/android/build/outputs/apk/profil/provenance.txt

          {
            echo "## APK Test"
            echo ""
            echo "| Élément | Valeur |"
            echo "| --- | --- |"
            echo "| Package | \`$package\` |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| SHA-256 de l'APK | \`$apk_sha256\` |"
            echo "| SHA-256 du certificat | \`$cert_sha256\` |"
            echo "| Origine de la signature | \`$signature_source\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier les rapports de test
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rapports-tests
          path: "**/build/reports/tests/"
          if-no-files-found: ignore

      - name: Publier les rapports lint
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rapports-lint
          path: "**/build/reports/lint-results-*"
          if-no-files-found: ignore

      # Seul cet APK optimisé est publié. L'APK Debug reste une construction
      # locale destinée au débogage avec Android Studio.
      - name: Publier l'APK Test
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ravenemu-test-apk
          path: |
            app/android/build/outputs/apk/profil/*.apk
            app/android/build/outputs/apk/profil/provenance.txt

  publish-test:
    name: APK Test téléchargeable
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: write
    steps:
      # La publication n'est possible qu'avec la clé Test dédiée : un APK signé
      # par la clé de débogage éphémère du runner changerait d'empreinte à
      # chaque construction et empêcherait toute mise à jour sur l'appareil.
      - name: Exiger la clé de signature Test
        env:
          TEST_KEYSTORE_BASE64: ${{ secrets.RAVENEMU_TEST_KEYSTORE_BASE64 }}
          TEST_KEYSTORE_PASSWORD: ${{ secrets.RAVENEMU_TEST_KEYSTORE_PASSWORD }}
          TEST_KEY_ALIAS: ${{ secrets.RAVENEMU_TEST_KEY_ALIAS }}
          TEST_KEY_PASSWORD: ${{ secrets.RAVENEMU_TEST_KEY_PASSWORD }}
        run: |
          manquants=()
          [[ -n "$TEST_KEYSTORE_BASE64" ]] || manquants+=("RAVENEMU_TEST_KEYSTORE_BASE64")
          [[ -n "$TEST_KEYSTORE_PASSWORD" ]] || manquants+=("RAVENEMU_TEST_KEYSTORE_PASSWORD")
          [[ -n "$TEST_KEY_ALIAS" ]] || manquants+=("RAVENEMU_TEST_KEY_ALIAS")
          [[ -n "$TEST_KEY_PASSWORD" ]] || manquants+=("RAVENEMU_TEST_KEY_PASSWORD")
          if (( ${#manquants[@]} > 0 )); then
            echo "::error::Secrets de signature Test manquants : ${manquants[*]}. Voir RELEASING.md."
            exit 1
          fi

      - name: Télécharger l'artefact du build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name ravenemu-test-apk \
            --dir "$RUNNER_TEMP/ravenemu-test"

      # Garde-fous d'identité de signature. Les empreintes de certificat sont
      # des données publiques : elles sont stockées en variables de dépôt
      # (`vars`), jamais en secrets.
      - name: Vérifier l'identité de la signature Test
        env:
          TEST_CERT_ATTENDU: ${{ vars.RAVENEMU_TEST_CERT_SHA256 }}
          RELEASE_CERT: ${{ vars.RAVENEMU_RELEASE_CERT_SHA256 }}
        run: |
          provenance="$RUNNER_TEMP/ravenemu-test/provenance.txt"
          if [[ ! -f "$provenance" ]]; then
            echo "::error::Provenance absente de l'artefact ravenemu-test-apk."
            exit 1
          fi
          # shellcheck disable=SC1090
          source "$provenance"

          # `keytool` affiche l'empreinte en majuscules séparées par des
          # deux-points, `apksigner` en minuscules d'un seul tenant. Les deux
          # désignent le même certificat : on compare des valeurs normalisées
          # plutôt que d'imposer un format de recopie.
          normaliser() { local v="${1//:/}"; echo "${v,,}"; }
          cert_sha256="$(normaliser "$cert_sha256")"
          TEST_CERT_ATTENDU="$(normaliser "$TEST_CERT_ATTENDU")"
          RELEASE_CERT="$(normaliser "$RELEASE_CERT")"

          if [[ "$signature_source" != "cle-test-dediee" ]]; then
            echo "::error::L'APK a été signé avec « $signature_source » au lieu de la clé Test dédiée."
            exit 1
          fi

          if [[ -n "$RELEASE_CERT" && "$cert_sha256" == "$RELEASE_CERT" ]]; then
            echo "::error::L'APK Test est signé avec le certificat Release. Les deux clés doivent rester distinctes."
            exit 1
          fi

          if [[ -z "$TEST_CERT_ATTENDU" ]]; then
            echo "::warning::Variable RAVENEMU_TEST_CERT_SHA256 non définie : la stabilité de la signature n'est pas vérifiée. Empreinte observée : $cert_sha256"
          elif [[ "$cert_sha256" != "$TEST_CERT_ATTENDU" ]]; then
            echo "::error::Certificat Test inattendu ($cert_sha256). Une rotation de clé casserait la mise à jour des APK déjà installés."
            exit 1
          fi

      - name: Préparer l'APK et son empreinte
        run: |
          apk_path="$(find "$RUNNER_TEMP/ravenemu-test" -type f -name '*.apk' -print -quit)"
          if [[ -z "$apk_path" ]]; then
            echo "::error::Aucun APK Test trouvé dans l'artefact."
            exit 1
          fi
          # shellcheck disable=SC1090
          source "$RUNNER_TEMP/ravenemu-test/provenance.txt"

          cp "$apk_path" "$RUNNER_TEMP/RavenEmu-test.apk"
          (
            cd "$RUNNER_TEMP"
            sha256sum RavenEmu-test.apk > RavenEmu-test.apk.sha256
          )

          cat > "$RUNNER_TEMP/test-release-notes.md" <<EOF
          Dernier APK Test optimisé construit automatiquement depuis la branche \`main\`.

          | Élément | Valeur |
          | --- | --- |
          | Package | \`$package\` |
          | Commit | \`$GITHUB_SHA\` |
          | SHA-256 de l'APK | \`$apk_sha256\` |
          | SHA-256 du certificat de signature | \`$cert_sha256\` |

          Cet APK est signé par la **clé Test dédiée** du projet, distincte de la clé Release :
          l'empreinte du certificat ci-dessus reste stable d'une construction à l'autre, ce qui
          permet de mettre à jour l'application installée sans la désinstaller. Il conserve les
          diagnostics et laisse Android optimiser le moteur.

          Vérification :

          \`\`\`bash
          sha256sum -c RavenEmu-test.apk.sha256
          apksigner verify --print-certs RavenEmu-test.apk
          \`\`\`
          EOF

      - name: Mettre à jour la préversion Test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view test-latest --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/test-latest" \
              -f sha="$GITHUB_SHA" \
              -F force=true
            gh release edit test-latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "RavenEmu Test" \
              --notes-file "$RUNNER_TEMP/test-release-notes.md" \
              --prerelease
            gh release upload test-latest \
              "$RUNNER_TEMP/RavenEmu-test.apk" \
              "$RUNNER_TEMP/RavenEmu-test.apk.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create test-latest \
              "$RUNNER_TEMP/RavenEmu-test.apk" \
              "$RUNNER_TEMP/RavenEmu-test.apk.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "RavenEmu Test" \
              --notes-file "$RUNNER_TEMP/test-release-notes.md" \
              --prerelease
          fi

  # Publication Release. Ce job ne se déclenche **jamais** sur un push de
  # branche ordinaire : il faut soit un tag `v*`, soit une exécution manuelle
  # demandant explicitement la publication. L'environnement `release` ajoute
  # une approbation humaine et restreint l'accès aux secrets de signature
  # (protections à configurer dans GitHub, voir RELEASING.md).
  release:
    name: Release signé (APK + AAB)
    runs-on: ubuntu-latest
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publier_release)
    environment: release
    permissions:
      contents: read
    env:
      # Secrets GitHub : le keystore et ses mots de passe ne sont jamais
      # stockés dans le dépôt. Ces secrets sont propres à Release et ne sont
      # jamais utilisés pour l'APK Test, qui a sa propre clé RAVENEMU_TEST_*.
      KEYSTORE_BASE64: ${{ secrets.RAVENEMU_KEYSTORE_BASE64 }}
    steps:
      # Le job n'existe que pour produire des livrables signés : sans clé, il
      # échoue au lieu de terminer en succès sans rien publier.
      - name: Exiger la clé de signature Release
        if: env.KEYSTORE_BASE64 == ''
        run: |
          echo "::error::Le secret RAVENEMU_KEYSTORE_BASE64 est absent : aucun livrable Release ne peut être signé. Voir RELEASING.md."
          exit 1

      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic

      - name: Restaurer le keystore depuis les secrets
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ravenemu.jks"
          if [[ ! -s "$RUNNER_TEMP/ravenemu.jks" ]]; then
            echo "::error::RAVENEMU_KEYSTORE_BASE64 n'est pas un keystore encodé en base64 exploitable."
            exit 1
          fi
          echo "RAVENEMU_KEYSTORE_PATH=$RUNNER_TEMP/ravenemu.jks" >> "$GITHUB_ENV"

      - name: Construire l'APK et l'App Bundle Release signés
        env:
          RAVENEMU_KEYSTORE_PASSWORD: ${{ secrets.RAVENEMU_KEYSTORE_PASSWORD }}
          RAVENEMU_KEY_ALIAS: ${{ secrets.RAVENEMU_KEY_ALIAS }}
          RAVENEMU_KEY_PASSWORD: ${{ secrets.RAVENEMU_KEY_PASSWORD }}
        run: ./gradlew :app:android:assembleRelease :app:android:bundleRelease

      - name: Décrire les livrables Release (empreintes et provenance)
        env:
          TEST_CERT: ${{ vars.RAVENEMU_TEST_CERT_SHA256 }}
        run: |
          apk="$(find app/android/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          aab="$(find app/android/build/outputs/bundle/release -type f -name '*.aab' -print -quit)"
          if [[ -z "$apk" || -z "$aab" ]]; then
            echo "::error::Livrables Release incomplets (APK ou AAB manquant)."
            exit 1
          fi

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          cert_sha256="$(
            "$apksigner" verify --print-certs "$apk" |
              sed -n 's/.*certificate SHA-256 digest: *//p' | head -1
          )"
          if [[ -z "$cert_sha256" ]]; then
            echo "::error::L'APK Release n'est pas signé."
            exit 1
          fi

          normaliser() { local v="${1//:/}"; echo "${v,,}"; }
          if [[ -n "$TEST_CERT" && "$(normaliser "$cert_sha256")" == "$(normaliser "$TEST_CERT")" ]]; then
            echo "::error::L'APK Release est signé avec le certificat Test. Les deux clés doivent rester distinctes."
            exit 1
          fi

          {
            echo "## Livrables Release"
            echo ""
            echo "| Élément | Valeur |"
            echo "| --- | --- |"
            echo "| Package | \`com.ravenemu.app\` |"
            echo "| Référence | \`$GITHUB_REF\` |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| SHA-256 de l'APK | \`$(sha256sum "$apk" | cut -d' ' -f1)\` |"
            echo "| SHA-256 de l'AAB | \`$(sha256sum "$aab" | cut -d' ' -f1)\` |"
            echo "| SHA-256 du certificat | \`$cert_sha256\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier l'APK Release signé
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ravenemu-release-apk
          path: app/android/build/outputs/apk/release/*.apk

      - name: Publier l'App Bundle Release signé
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ravenemu-release-aab
          path: app/android/build/outputs/bundle/release/*.aab