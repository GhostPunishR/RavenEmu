name: Android CI

on:
  push:
    branches: [main, master, develop, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, lint et APK Test
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Installer Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Tests unitaires
        run: ./gradlew test

      - name: Lint
        run: ./gradlew lint

      - name: Construire l'APK Debug
        run: ./gradlew assembleDebug

      - name: Construire l'APK Test optimisé
        run: ./gradlew assembleProfil

      - name: Publier les rapports de test
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rapports-tests
          path: "**/build/reports/tests/"
          if-no-files-found: ignore

      - name: Publier les rapports lint
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rapports-lint
          path: "**/build/reports/lint-results-*"
          if-no-files-found: ignore

      # Seul cet APK optimisé est publié. L'APK Debug reste une construction
      # locale destinée au débogage avec Android Studio.
      - name: Publier l'APK Test
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ravenemu-test-apk
          path: app/build/outputs/apk/profil/*.apk

  publish-test:
    name: APK Test téléchargeable
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: write
    steps:
      - name: Télécharger l'artefact du build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name ravenemu-test-apk \
            --dir "$RUNNER_TEMP/ravenemu-test"

      - name: Préparer l'APK et son empreinte
        run: |
          apk_path="$(find "$RUNNER_TEMP/ravenemu-test" -type f -name '*.apk' -print -quit)"
          if [[ -z "$apk_path" ]]; then
            echo "Aucun APK Test trouvé dans l'artefact." >&2
            exit 1
          fi

          cp "$apk_path" "$RUNNER_TEMP/RavenEmu-test.apk"
          (
            cd "$RUNNER_TEMP"
            sha256sum RavenEmu-test.apk > RavenEmu-test.apk.sha256
          )

          cat > "$RUNNER_TEMP/test-release-notes.md" <<EOF
          Dernier APK Test optimisé construit automatiquement depuis la branche \`main\`.

          - Commit : \`$GITHUB_SHA\`
          - Package : \`com.ravenemu.app.profil\`
          - Usage : essais et mesures de compatibilité

          Cet APK utilise la signature de développement, conserve les diagnostics et permet à Android d'optimiser le moteur.
          EOF

      - name: Mettre à jour la préversion Test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view test-latest --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/test-latest" \
              -f sha="$GITHUB_SHA" \
              -F force=true
            gh release edit test-latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "RavenEmu Test" \
              --notes-file "$RUNNER_TEMP/test-release-notes.md" \
              --prerelease
            gh release upload test-latest \
              "$RUNNER_TEMP/RavenEmu-test.apk" \
              "$RUNNER_TEMP/RavenEmu-test.apk.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create test-latest \
              "$RUNNER_TEMP/RavenEmu-test.apk" \
              "$RUNNER_TEMP/RavenEmu-test.apk.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "RavenEmu Test" \
              --notes-file "$RUNNER_TEMP/test-release-notes.md" \
              --prerelease
          fi

      - name: Retirer l'ancienne préversion Debug
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view debug-latest --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release delete debug-latest \
              --repo "$GITHUB_REPOSITORY" \
              --cleanup-tag \
              --yes
          fi

  release:
    name: Release signé (APK + AAB)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    env:
      # Secrets GitHub : le keystore et ses mots de passe ne sont jamais
      # stockés dans le dépôt. Sans secrets, ni APK ni App Bundle Release
      # n'est construit ni publié : seuls des livrables signés sont diffusés.
      KEYSTORE_BASE64: ${{ secrets.RAVENEMU_KEYSTORE_BASE64 }}
    steps:
      - name: Signature non configurée
        if: env.KEYSTORE_BASE64 == ''
        run: |
          {
            echo "## Livrables Release non construits"
            echo ""
            echo "Les secrets de signature (RAVENEMU_KEYSTORE_BASE64,"
            echo "RAVENEMU_KEYSTORE_PASSWORD, RAVENEMU_KEY_ALIAS,"
            echo "RAVENEMU_KEY_PASSWORD) ne sont pas configurés : seuls un APK"
            echo "et un App Bundle (.aab) signés sont publiés. Pour tester,"
            echo "utilisez l'artefact ravenemu-test-apk du job de build"
            echo "(voir README.md#installation)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Récupérer le dépôt
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Installer Java
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurer Gradle
        if: env.KEYSTORE_BASE64 != ''
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Restaurer le keystore depuis les secrets
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ravenemu.jks"
          echo "RAVENEMU_KEYSTORE_PATH=$RUNNER_TEMP/ravenemu.jks" >> "$GITHUB_ENV"

      - name: Construire l'APK et l'App Bundle Release signés
        if: env.KEYSTORE_BASE64 != ''
        env:
          RAVENEMU_KEYSTORE_PASSWORD: ${{ secrets.RAVENEMU_KEYSTORE_PASSWORD }}
          RAVENEMU_KEY_ALIAS: ${{ secrets.RAVENEMU_KEY_ALIAS }}
          RAVENEMU_KEY_PASSWORD: ${{ secrets.RAVENEMU_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Publier l'APK Release signé
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ravenemu-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publier l'App Bundle Release signé
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ravenemu-release-aab
          path: app/build/outputs/bundle/release/*.aab
