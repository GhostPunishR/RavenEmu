name: RavenEmu / Android Dev

on:
  push:
    branches:
      - migration/native-libretro
    paths:
      - 'frontend/**'
      - 'android/**'
      - 'tests/hardware/**'
      - 'scripts/check_native_layout.py'
      - 'settings.gradle.kts'
      - 'docs/MIGRATION_NATIVE.md'
      - 'legal/attributions/**'
      - 'scripts/*native_sources.py'
      - 'scripts/test_native_video_pixels.py'
      - '.github/workflows/ci-android.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'android/**'
      - 'tests/hardware/**'
      - 'scripts/check_native_layout.py'
      - 'settings.gradle.kts'
      - 'docs/MIGRATION_NATIVE.md'
      - 'legal/attributions/**'
      - 'scripts/*native_sources.py'
      - 'scripts/test_native_video_pixels.py'
      - '.github/workflows/ci-android.yml'
  workflow_dispatch:

concurrency:
  group: ravenemu-android-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Frontend C - compilation et tests
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer les bibliothèques GLES et EGL
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl-dev libgles-dev libgl1-mesa-dri
      - name: Configurer CMake
        run: cmake -S frontend -B build/native-frontend -DCMAKE_BUILD_TYPE=Release -DRAVEN_VIDEO_PIXEL_TESTS=ON
      - name: Compiler le frontend, les pilotes et RavenCore
        run: |
          cmake --build build/native-frontend --parallel 2 --target \
            raven_frontend_test raven_frontend_fake_core raven_frontend_real_core_test \
            raven_frontend_options_test raven_frontend_fake_core_v1 raven_frontend_fake_core_variables \
            raven_frame_clock_test raven_frame_pacer_test raven_frontend_preempt_test raven_frontend_achievements_test \
            raven_frontend_fake_core_lag raven_frontend_fake_core_lag_incomplete \
            raven_native_video_pixels \
            raven_native_input_test raven_native_sensor_test raven_native_preview_test raven_native_audio_test raven_native_video_test \
            raven_native_sinc_test \
            ravenemu_gb_libretro ravenemu_gbc_libretro ravenemu_gba_libretro
      - name: Exécuter les tests C
        run: ctest --test-dir build/native-frontend --output-on-failure

  android:
    name: Android ARM64 - APK et tests
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Valider le wrapper Gradle
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Installer Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Vérifier l'organisation des sources
        run: python3 scripts/check_native_layout.py
      - name: Vérifier les langages autorisés
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('android/src')
          kotlin = list(source.rglob('*.kt')) + list(source.rglob('*.kts'))
          if kotlin:
              raise SystemExit('Kotlin source forbidden in android: ' + str(kotlin))
          build = Path('android/build.gradle.kts').read_text()
          if 'kotlin.plugin.compose' in build or 'project(":shared")' in build:
              raise SystemExit('Kotlin/Compose integration forbidden in android')
          print('Java + native C/C++ architecture validated')
          PY
      - name: Compiler l'APK ARM64 et exécuter les tests
        run: ./gradlew :android:assembleDebug :android:testDebugUnitTest :android:lintDebug :android:collectDebugCorrespondingSources --stacktrace
      - name: Vérifier et archiver les sources
        run: |
          python3 scripts/test_package_native_sources.py
          python3 scripts/package_native_sources.py
      - name: Contrôler les bibliothèques ARM64
        run: |
          python3 - <<'PY'
          import zipfile, pathlib
          apk = pathlib.Path('android/build/outputs/apk/debug/android-debug.apk')
          required = {'libraven_android.so', 'ravenemu_gb_libretro.so',
                      'ravenemu_gbc_libretro.so', 'ravenemu_gba_libretro.so'}
          with zipfile.ZipFile(apk) as z:
              found = {path.split('/')[-1] for path in z.namelist()
                       if path.startswith('lib/arm64-v8a/') and path.endswith('.so')}
          missing = required - found
          print('Packaged ARM64 libraries:', sorted(found))
          if missing:
              raise SystemExit(f'Missing ARM64 libraries: {sorted(missing)}')
          PY
      - name: Publier l'APK de développement et les sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ravenemu-android-dev-arm64
          path: |
            android/build/outputs/apk/debug/android-debug.apk
            android/build/outputs/sources/ravenemu-native-sources.tar.gz
          if-no-files-found: error
          retention-days: 7
