name: RavenEmu / Applications
# The RavenEmu app: Android (Java + JNI + C), the C frontend and RavenCore,
# and the repository rules. Every command starts from the repository root.
# On main, and for a release tag through release.yml, it also signs the
# Release APK; it never publishes anything itself (RELEASING.md).

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'android/**'
      - 'tests/**'
      - 'scripts/**'
      - 'policy/**'
      - 'legal/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'docs/MIGRATION_NATIVE.md'
      - 'TERMS.md'
      - 'PRIVACY.md'
      - 'LICENSE'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'frontend/**'
      - 'android/**'
      - 'tests/**'
      - 'scripts/**'
      - 'policy/**'
      - 'legal/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'docs/MIGRATION_NATIVE.md'
      - 'TERMS.md'
      - 'PRIVACY.md'
      - 'LICENSE'
      - '.github/workflows/**'
  workflow_dispatch:
  # release.yml runs this whole CI on a tag vX.Y.Z, then publishes its APK.
  workflow_call:
    outputs:
      version:
        description: Version of the signed APK, x.y.z
        value: ${{ jobs.production.outputs.version }}
      artifact:
        description: Name of the artifact holding the signed APK, its sources and SHA256SUMS.txt
        value: ${{ jobs.production.outputs.artifact }}

concurrency:
  group: ravenemu-applications-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy:
    name: Qualité du dépôt
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Valider le wrapper Gradle
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Installer Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          # Dependencies cached between runs: without it every run downloads
          # them all again, and Maven Central's rate limit (429) fails the job.
          cache: gradle
          # The key hashes these files. Each Gradle job lists its own module so
          # the two keys differ: with one shared key, whichever job ends first
          # saves only its own dependencies and the other cannot save.
          cache-dependency-path: |
            settings.gradle.kts
            build.gradle.kts
            gradle.properties
            gradle/libs.versions.toml
            gradle/wrapper/gradle-wrapper.properties
            policy/build.gradle.kts

      # Le wrapper valide, la distribution qu'il télécharge reste à contrôler.
      # `distributionSha256Sum` s'en charge à chaque exécution, sur le poste des
      # développeurs comme ici : le wrapper refuse une archive dont l'empreinte
      # diffère. Reste à s'assurer que la valeur inscrite dans le dépôt est bien
      # celle que Gradle publie — sans quoi on épinglerait avec conviction une
      # archive substituée. Cette étape compare les deux.
      - name: Contrôler l'empreinte de la distribution Gradle
        run: |
          properties=gradle/wrapper/gradle-wrapper.properties
          url="$(sed -n 's/^distributionUrl=//p' "$properties" | sed 's/\\//g')"
          attendu="$(sed -n 's/^distributionSha256Sum=//p' "$properties")"

          if [[ -z "$attendu" ]]; then
            echo "::error::distributionSha256Sum absent de $properties : la distribution Gradle n'est pas épinglée. Voir CONTRIBUTING.md."
            exit 1
          fi

          # Empreinte publiée par Gradle à côté de l'archive. Une panne réseau ne
          # doit pas faire échouer la construction : le wrapper vérifie déjà
          # l'archive localement, ce contrôle-ci porte sur la déclaration.
          officiel="$(curl -fsSL --retry 3 --max-time 30 "$url.sha256" || true)"
          if [[ -z "$officiel" ]]; then
            echo "::notice::Empreinte officielle indisponible ($url.sha256), comparaison ignorée."
            exit 0
          fi

          if [[ "${attendu,,}" != "${officiel,,}" ]]; then
            echo "::error::distributionSha256Sum ($attendu) ne correspond pas à l'empreinte publiée par Gradle ($officiel)."
            exit 1
          fi
          echo "Distribution Gradle épinglée sur l'empreinte publiée par Gradle."

      - name: Règles des workflows
        run: ./gradlew :policy:test --stacktrace

  smoke:
    name: Frontend C - compilation et tests
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer les bibliothèques GLES et EGL
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl-dev libgles-dev libgl1-mesa-dri
      # The RetroAchievements JNI bridge is tested on the host's JVM.
      - name: Installer Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Configurer CMake
        run: cmake -S frontend -B build/native-frontend -DCMAKE_BUILD_TYPE=Release -DRAVEN_VIDEO_PIXEL_TESTS=ON
      - name: Compiler le frontend, les pilotes et RavenCore
        run: |
          cmake --build build/native-frontend --parallel 2 --target \
            raven_frontend_test raven_frontend_fake_core raven_frontend_real_core_test \
            raven_frontend_options_test raven_frontend_fake_core_v1 raven_frontend_fake_core_variables \
            raven_frame_clock_test raven_frame_pacer_test raven_frontend_preempt_test raven_frontend_achievements_test \
            raven_frontend_fake_core_lag raven_frontend_fake_core_lag_incomplete \
            raven_native_video_pixels \
            raven_native_input_test raven_native_sensor_test raven_native_preview_test raven_native_audio_test raven_native_video_test raven_native_shader_preset_test \
            raven_native_sinc_test raven_native_state_progress_test raven_native_av_sync_test raven_jni_achievements \
            ravenemu_gbc_libretro ravenemu_gba_libretro
      - name: Exécuter les tests C
        run: ctest --test-dir build/native-frontend --output-on-failure

  android:
    name: Android ARM64 - APK et tests
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Valider le wrapper Gradle
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Installer Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          # Dependencies cached between runs, as in the repository job, under
          # a key of its own (see there).
          cache: gradle
          cache-dependency-path: |
            settings.gradle.kts
            build.gradle.kts
            gradle.properties
            gradle/libs.versions.toml
            gradle/wrapper/gradle-wrapper.properties
            android/build.gradle.kts
      - name: Vérifier l'organisation des sources
        run: python3 scripts/check_native_layout.py
      - name: Contrôler la version et les notes de release
        run: |
          python3 scripts/test_release_version.py
          python3 scripts/release_version.py
      - name: Vérifier les langages autorisés
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('android/src')
          kotlin = list(source.rglob('*.kt')) + list(source.rglob('*.kts'))
          if kotlin:
              raise SystemExit('Kotlin source forbidden in android: ' + str(kotlin))
          build = Path('android/build.gradle.kts').read_text()
          if 'kotlin.plugin.compose' in build or 'project(":shared")' in build:
              raise SystemExit('Kotlin/Compose integration forbidden in android')
          print('Java + native C/C++ architecture validated')
          PY
      - name: Compiler l'APK ARM64 et exécuter les tests
        run: ./gradlew :android:assembleDebug :android:testDebugUnitTest :android:lintDebug :android:collectDebugCorrespondingSources --stacktrace
      - name: Contrôler l'optimisation du code natif
        run: |
          python3 scripts/test_check_native_optimization.py
          python3 scripts/check_native_optimization.py
      - name: Vérifier et archiver les sources
        run: |
          python3 scripts/test_package_native_sources.py
          python3 scripts/package_native_sources.py
      - name: Contrôler les bibliothèques ARM64
        run: |
          python3 - <<'PY'
          import zipfile, pathlib
          apk = pathlib.Path('android/build/outputs/apk/debug/android-debug.apk')
          # Game Boy Color, which runs the Game Boy's games too: one core.
          required = {'libraven_android.so', 'libravenemu_gbc_libretro.so', 'libravenemu_gba_libretro.so'}
          with zipfile.ZipFile(apk) as z:
              found = {path.split('/')[-1] for path in z.namelist()
                       if path.startswith('lib/arm64-v8a/') and path.endswith('.so')}
          missing = required - found
          print('Packaged ARM64 libraries:', sorted(found))
          if missing:
              raise SystemExit(f'Missing ARM64 libraries: {sorted(missing)}')
          if found & {'ravenemu_gb_libretro.so', 'libravenemu_gb_libretro.so'}:
              raise SystemExit('The retired Game Boy core is still packaged')
          # Android extracts only lib*.so from a non-debuggable (Release) APK.
          unextracted = sorted(name for name in found if not name.startswith('lib'))
          if unextracted:
              raise SystemExit(f'Not installed from a Release APK (no lib prefix): {unextracted}')
          PY
      - name: Publier l'APK de développement et les sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ravenemu-android-dev-arm64
          path: |
            android/build/outputs/apk/debug/android-debug.apk
            android/build/outputs/sources/ravenemu-native-sources.tar.gz
          if-no-files-found: error
          retention-days: 7

  production:
    name: Android ARM64 - APK Release signé
    # Signing credentials are loaded only for main and the release tags
    # vX.Y.Z, never for a pull request. release.yml publishes a tag's APK.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [policy, smoke, android]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact: ${{ steps.version.outputs.artifact }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, to check that a tag's commit is on main.
          fetch-depth: 0
          persist-credentials: false
      - name: Valider le wrapper Gradle
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Installer Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            settings.gradle.kts
            build.gradle.kts
            gradle.properties
            gradle/libs.versions.toml
            gradle/wrapper/gradle-wrapper.properties
            android/build.gradle.kts
      - name: Lire la version et contrôler le tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 scripts/release_version.py)"
          artifact="RavenEmu-$version-${GITHUB_SHA::7}-arm64"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # The tag equals the version, CHANGELOG.md holds its section,
            # and the commit is one of main's: nothing else is released.
            python3 scripts/release_version.py --tag "$GITHUB_REF_NAME"
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::Le tag $GITHUB_REF_NAME ne pointe pas sur un commit de main."
              exit 1
            fi
            artifact="RavenEmu-$version-arm64"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      - name: Compiler l'APK Release et rassembler les sources
        run: ./gradlew :android:assembleRelease :android:collectDebugCorrespondingSources --stacktrace
      - name: Aligner, signer et vérifier l'APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RAVENEMU_VERSION: ${{ steps.version.outputs.version }}
        run: >-
          bash scripts/sign_release_apk.sh
          android/build/outputs/apk/release/android-release-unsigned.apk
          "android/build/outputs/release/RavenEmu-$RAVENEMU_VERSION.apk"
          "$RAVENEMU_VERSION"
      - name: Archiver les sources de l'APK signé et les empreintes
        env:
          RAVENEMU_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/test_package_native_sources.py
          release=android/build/outputs/release
          python3 scripts/package_native_sources.py --apk "$release/RavenEmu-$RAVENEMU_VERSION.apk" \
            --output "$release/RavenEmu-$RAVENEMU_VERSION-sources.tar.gz"
          cd "$release"
          sha256sum "RavenEmu-$RAVENEMU_VERSION.apk" "RavenEmu-$RAVENEMU_VERSION-sources.tar.gz" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Conserver l'APK signé, ses sources et leurs empreintes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: android/build/outputs/release/
          if-no-files-found: error
          retention-days: 14
