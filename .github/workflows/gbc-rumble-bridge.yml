name: GBC rumble bridge

on:
  push:
    branches:
      - feat/gbc-completeness

permissions:
  contents: write

jobs:
  apply-and-test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gbc-completeness
          fetch-depth: 0

      - name: Apply GBC rumble bridge
        run: |
          python3 tools/apply_gbc_rumble_bridge.py
          python3 tools/adjust_gb_parity.py

      - name: Build native cores
        run: |
          cmake -S cores -B build/native-host -DRAVENEMU_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/native-host --parallel 2
          ctest --test-dir build/native-host --output-on-failure

      - name: Run JVM tests
        run: ./gradlew jvmTest --stacktrace

      - name: Commit validated bridge
        run: |
          git rm tools/apply_gbc_rumble_bridge.py tools/adjust_gb_parity.py .github/workflows/gbc-rumble-bridge.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(gbc): relier le rumble MBC5 à Android"
          git push origin HEAD:feat/gbc-completeness
