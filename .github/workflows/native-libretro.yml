name: Native Libretro migration

on:
  push:
    branches:
      - migration/native-libretro
    paths:
      - 'frontend/**'
      - 'androidNative/**'
      - 'settings.gradle.kts'
      - 'docs/MIGRATION_NATIVE.md'
      - 'third_party/retroarch/**'
      - 'scripts/*native_sources.py'
      - '.github/workflows/native-libretro.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'androidNative/**'
      - 'settings.gradle.kts'
      - 'docs/MIGRATION_NATIVE.md'
      - 'third_party/retroarch/**'
      - 'scripts/*native_sources.py'
      - '.github/workflows/native-libretro.yml'
  workflow_dispatch:

concurrency:
  group: native-libretro-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: C frontend and RavenCore Libretro builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure CMake
        run: cmake -S frontend -B build/native-frontend -DCMAKE_BUILD_TYPE=Release
      - name: Build frontend, test core and RavenCore adapters
        run: |
          cmake --build build/native-frontend --parallel 2 --target \
            raven_frontend_test raven_frontend_fake_core raven_frontend_real_core_test \
            raven_native_input_test raven_native_preview_test raven_native_audio_test raven_native_video_test \
            ravenemu_gb_libretro ravenemu_gbc_libretro ravenemu_gba_libretro
      - name: Run frontend smoke tests
        run: ctest --test-dir build/native-frontend --output-on-failure

  android:
    name: ARM64 Java/JNI/OpenGL preview APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Setup Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Enforce Java/C/C++ only in the migrated app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('androidNative/src')
          kotlin = list(source.rglob('*.kt')) + list(source.rglob('*.kts'))
          if kotlin:
              raise SystemExit('Kotlin source forbidden in androidNative: ' + str(kotlin))
          build = Path('androidNative/build.gradle.kts').read_text()
          if 'kotlin.plugin.compose' in build or 'project(":shared")' in build:
              raise SystemExit('Kotlin/Compose integration forbidden in androidNative')
          print('Java + native C/C++ architecture validated')
          PY
      - name: Assemble ARM64 native APK, run Java tests and lint
        run: ./gradlew :androidNative:assembleDebug :androidNative:testDebugUnitTest :androidNative:lintDebug :androidNative:collectDebugCorrespondingSources --stacktrace
      - name: Verify and package corresponding sources
        run: |
          python3 scripts/test_package_native_sources.py
          python3 scripts/package_native_sources.py
      - name: Inspect APK native libraries
        run: |
          python3 - <<'PY'
          import zipfile, pathlib
          apk = pathlib.Path('androidNative/build/outputs/apk/debug/androidNative-debug.apk')
          required = {'libraven_android.so', 'ravenemu_gb_libretro.so',
                      'ravenemu_gbc_libretro.so', 'ravenemu_gba_libretro.so'}
          with zipfile.ZipFile(apk) as z:
              found = {path.split('/')[-1] for path in z.namelist()
                       if path.startswith('lib/arm64-v8a/') and path.endswith('.so')}
          missing = required - found
          print('Packaged ARM64 libraries:', sorted(found))
          if missing:
              raise SystemExit(f'Missing ARM64 libraries: {sorted(missing)}')
          PY
      - name: Upload debug preview APK and corresponding sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ravenemu-android-native-arm64-debug
          path: |
            androidNative/build/outputs/apk/debug/androidNative-debug.apk
            androidNative/build/outputs/sources/ravenemu-native-sources.tar.gz
          if-no-files-found: error
          retention-days: 7
